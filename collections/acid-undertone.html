        const CP='#fe018a',CB='#44526f',CD='#292f48',ch=[{t:0,c:CP},{t:0,c:CB},{t:0,c:CD},{t:0,c:CP},{t:0,c:CB},{t:0,c:CD}];
        const toSt=(n)=>({n,p:n?1:0});
        const pt=[55,55,0,55,55,0,55,55,0,55,55,0,55,55,55,55].map(toSt);
        
        function res(){const s=Math.min(window.innerWidth,window.innerHeight);_w=cvs.width=s;_h=cvs.height=s;cX=_w/2;cY=_h/2}
        window.onresize=res;res();
        
        function initA(){
            if(aCtx)return;
            aCtx=new(window.AudioContext||window.webkitAudioContext)();
            mG=aCtx.createGain();mG.gain.value=0.6;
            dN=aCtx.createDelay();dN.delayTime.value=0.4;
            dGn=aCtx.createGain();dGn.gain.value=0.35;
            dN.connect(dGn);dGn.connect(dN);
            comp=aCtx.createDynamicsCompressor();
            mG.connect(comp);dN.connect(mG);comp.connect(aCtx.destination);
            const bS=aCtx.sampleRate*2;
            nB=aCtx.createBuffer(1,bS,aCtx.sampleRate);
            const d=nB.getChannelData(0);
            for(let i=0;i<bS;i++)d[i]=Math.random()*2-1;
        }

        const Sy={
            k:(t)=>{const o=aCtx.createOscillator(),g=aCtx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.85,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(mG);o.start(t);o.stop(t+.4);ch[0].t=1},
            s:(t)=>{const n=aCtx.createBufferSource();n.buffer=nB;const f=aCtx.createBiquadFilter();f.type='highpass';f.frequency.value=1200;const g=aCtx.createGain(),o=aCtx.createOscillator();o.frequency.setValueAtTime(180,t);o.type='triangle';const og=aCtx.createGain();og.gain.setValueAtTime(0.3,t);og.gain.exponentialRampToValueAtTime(0.01,t+.1);n.connect(f);f.connect(g);g.connect(mG);o.connect(og);og.connect(mG);g.gain.setValueAtTime(0.45,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);n.start(t);o.start(t);o.stop(t+0.15);ch[1].t=1},
            h:(t)=>{const n=aCtx.createBufferSource();n.buffer=nB;const f=aCtx.createBiquadFilter();f.type='highpass';f.frequency.value=8000;const g=aCtx.createGain();n.connect(f);f.connect(g);g.connect(mG);g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);n.start(t);ch[2].t=1},
            sk:(t,v)=>{const n=aCtx.createBufferSource();n.buffer=nB;const f=aCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=10000;f.Q.value=6;const g=aCtx.createGain();n.connect(f);f.connect(g);g.connect(mG);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.025);n.start(t);ch[2].t=Math.max(ch[2].t,v*4)},
            c:(t)=>{const n=aCtx.createBufferSource();n.buffer=nB;const f=aCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;const g=aCtx.createGain();n.connect(f);f.connect(g);g.connect(mG);[0,.01,.02,.03].forEach(o=>{g.gain.setValueAtTime(0.69,t+o);g.gain.exponentialRampToValueAtTime(0.01,t+o+0.01)});g.gain.setValueAtTime(0.69,t+.04);g.gain.exponentialRampToValueAtTime(0.001,t+.2);n.start(t);ch[1].t=1},
            a:(f,t,c,qr)=>{
                const o=aCtx.createOscillator(),s=aCtx.createOscillator();o.type='sawtooth';s.type='sine';
                o.frequency.setValueAtTime(f,t);s.frequency.setValueAtTime(f/2,t);
                const fi=aCtx.createBiquadFilter();fi.type='lowpass';fi.frequency.setValueAtTime(c,t);fi.Q.setValueAtTime(qr,t);
                const sh=aCtx.createWaveShaper(),cu=new Float32Array(44100);
                for(let i=0;i<44100;++i)cu[i]=Math.tanh((i*2/44100-1)*1.5);
                sh.curve=cu;const g=aCtx.createGain(),sg=aCtx.createGain();
                g.gain.setValueAtTime(0.42,t);g.gain.exponentialRampToValueAtTime(0.001,t+.1);
                sg.gain.setValueAtTime(0.55,t);sg.gain.exponentialRampToValueAtTime(0.001,t+.1);
                o.connect(fi);fi.connect(sh);sh.connect(g);g.connect(mG);
                s.connect(sg);sg.connect(mG);
                o.start(t);s.start(t);o.stop(t+.11);ch[3].t=1
            },
            d:(t)=>{const f=aCtx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(200,t);f.frequency.exponentialRampToValueAtTime(1200,t+.5);f.frequency.exponentialRampToValueAtTime(100,t+3);const g=aCtx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.4,t+0.1);g.gain.exponentialRampToValueAtTime(0.001,t+4);[40,40.5,39.5].forEach(hz=>{const o=aCtx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(hz,t);o.connect(f);o.start(t);o.stop(t+4)});f.connect(g);g.connect(mG);g.connect(dN);ch[4].t=1}
        };

        function sc(){
            while(isP&&nST<aCtx.currentTime+.1){
                const sL=cS%256,bC=Math.floor(sL/16),s16=sL%16,st=pt[s16],isR=!(bC===15&&s16>=9);
                if(s16===0&&bC%4===0)Sy.d(nST);
                
                if(!isR) { sF=0; dGn.gain.setTargetAtTime(0, nST, 0.005); } 
                else if(s16===0) { dGn.gain.setTargetAtTime(0.35, nST, 0.005); }

                if(isR&&st.p&&st.n)Sy.a(st.n,nST,220+(bC/15*1600),8+(bC/15*15));
                
                let pK=0;
                if(bC < 8) {
                    let m4 = bC % 4;
                    if(m4 === 0) pK = [0,2,4,8,12].includes(s16);
                    else if(m4 === 3) pK = [0,4,8,12,14].includes(s16);
                    else pK = (s16 % 4 === 0);
                } else if(bC >= 8 && bC <= 11) {
                    pK = [0,2,4].includes(s16);
                } else if(bC >= 12 && bC <= 13) {
                    pK = [0,2,4,8,10,12].includes(s16);
                } else if(bC === 14) {
                    pK = [0,2,4,6,8,10,12,14].includes(s16);
                } else if(bC === 15) {
                    pK = s16 < 10;
                }

                if(isR && pK) {
                    Sy.k(nST);
                    sF = 1 - sF; 
                }

                if(isR && bC%2===1 && bC!==15 && [12,13,14].includes(s16)) Sy.s(nST);
                
                const isVeryEnd = (bC === 15 && s16 >= 12);
                if((isR && s16%8===4) || isVeryEnd) {
                    Sy.c(nST);
                    if(isVeryEnd) Sy.s(nST);
                }
                
                if(isR && s16%4===2) Sy.h(nST);
                if(isR) Sy.sk(nST, (s16%2===0?0.1:0.04));
                nST+=0.25*(60/bpm);cS++
            }
        }

        async function tP(){if(!isS){initA();await aCtx.resume();isS=1}isP=!isP;if(isP){nST=aCtx.currentTime;cS=0;sF=1}else sF=0}

        function dSc(){ctx.save();ctx.strokeStyle="rgba(0,0,0,.85)";ctx.lineWidth=1;for(let i=0;i<_h;i+=4){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(_w,i);ctx.stroke()}ctx.restore()}
        
        function dS(idx,t){
            const mx=_w*1.6,fl=(idx/ch.length)*mx+vF,ct=ch[idx].c===CP?5:3;
            for(let i=0;i<ct;i++){
                const s=(fl+i*26)%mx;if(s<10)continue;ctx.save();ctx.beginPath();ctx.strokeStyle=ch[idx].c;ctx.lineWidth=1+t*4;
                ctx.globalAlpha=.45+t*.55;
                ctx.strokeRect(cX-s/2,cY-s/2,s,s);ctx.restore()
            }
        }

        function drawObj(acidT) {
            if(sI.complete && sI.naturalWidth > 0){
                // Draw character image only - removed all masked scanline logic
                ctx.drawImage(sI, sF*1000, 0, 1000, 1000, 0, 0, _w, _h);
            } else {
                ctx.save();
                ctx.strokeStyle = CP; ctx.lineWidth = 1; ctx.globalAlpha = 0.1 + acidT * 0.4;
                ctx.strokeRect(cX-100, cY-150, 200, 300);
                ctx.restore();
            }
        }

        function render(){
            if(isP)sc();vF+=1.5;ctx.clearRect(0,0,_w,_h);
            ctx.fillStyle = '#19181d'; ctx.fillRect(0,0,_w,_h);
            dSc();
            ch.forEach((c,i)=>{dS(i,c.t);c.t*=.88});
            drawObj(ch[3].t);
            requestAnimationFrame(render)
        }
        render();cvs.onclick=tP;
    </script>
