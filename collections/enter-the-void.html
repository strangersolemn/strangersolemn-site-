ById('glitch-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // The specific palette
        const palette = [
            '#61708d', 
            '#181318', 
            '#fd008e', 
            '#2f3751', 
            '#1c161c'
        ];

        let width, height;
        
        // Scale Factor
        const scale = 4; 

        function resize() {
            // Get the dimensions of the SQUARE container, not the window
            const rect = canvas.getBoundingClientRect();
            
            // Calculate internal resolution based on the visual size
            width = Math.ceil(rect.width / scale);
            height = Math.ceil(rect.height / scale);
            
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        // Initial call
        resize();

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        function randomColor() {
            return palette[Math.floor(Math.random() * palette.length)];
        }

        // MODE 1: Black and White TV Static (Snow)
        function drawBWStatic() {
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const val = Math.random() > 0.5 ? 255 : 0;
                data[i] = val;     
                data[i + 1] = val; 
                data[i + 2] = val; 
                data[i + 3] = 255; 
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // MODE 2: Horizontal Color Noise
        function drawScanlineNoise() {
            ctx.fillStyle = randomColor();
            ctx.fillRect(0, 0, width, height); 
            
            const numLines = height / 2; 
            for (let i = 0; i < numLines; i++) {
                ctx.fillStyle = randomColor();
                ctx.fillRect(0, randomInt(0, height), width, 1);
            }
        }

        // MODE 3: The "Lines" Glitch
        function drawLineGlitch() {
            ctx.fillStyle = palette[1];
            ctx.fillRect(0, 0, width, height);

            const numStrips = randomInt(10, 50);
            for (let i = 0; i < numStrips; i++) {
                ctx.fillStyle = randomColor();
                const h = randomInt(1, 6);
                const y = randomInt(0, height);
                ctx.fillRect(0, y, width, h);
            }
        }

        function drawGlitch() {
            const rand = Math.random();

            if (rand < 0.15) {
                drawBWStatic();
            } else if (rand < 0.25) {
                ctx.fillStyle = randomColor();
                ctx.fillRect(0, 0, width, height);
            } else if (rand < 0.55) {
                drawScanlineNoise();
            } else {
                drawLineGlitch();
            }

            // Screen Tearing
            if (Math.random() > 0.1) {
                const sliceHeight = randomInt(2, 60);
                const sliceY = randomInt(0, height - sliceHeight);
                const offsetX = randomInt(-20, 20); 
                try {
                    ctx.drawImage(canvas, 0, sliceY, width, sliceHeight, offsetX, sliceY, width, sliceHeight);
                } catch (e) {}
            }

            // Horizontal Bar Invert
            if (Math.random() > 0.9) {
                const y = randomInt(0, height - 20);
                const h = randomInt(2, 20);
                ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#000000';
                ctx.fillRect(0, y, width, h);
            }

            requestAnimationFrame(drawGlitch);
        }

        drawGlitch();</script>
