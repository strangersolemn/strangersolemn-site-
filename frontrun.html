<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRONTRUN — Stranger Solemn</title>
    <meta property="og:title" content="FRONTRUN — Stranger Solemn" />
    <meta property="og:description" content="666 fully on-chain generative pieces on Ethereum. The wallet that holds a piece writes how it looks." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@strangersolemn" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=57">
  </head>
  <body>
    <a class="site-banner" href="https://frontrun.strangersolemn.art" target="_blank" rel="noopener">
      <span class="site-banner-tag">New</span>
      <span class="site-banner-text">FRONTRUN &mdash; fully on-chain Ethereum collection</span>
      <span class="site-banner-arrow">&rarr;</span>
    </a>
    <nav class="site-nav" aria-label="Site">
      <a class="site-nav-link" href="index.html">About</a>
      <a class="site-nav-link" href="collections.html">Collections</a>
      <a class="site-nav-link" href="collectors.html">Collectors</a>
      <a class="site-nav-link is-frontrun is-active" href="frontrun.html">FRONTRUN</a>
      <a class="site-nav-link" href="articles.html">Articles</a>
      <span class="site-nav-link is-soon" title="Opening soon">Discord &middot; soon</span>
    </nav>
    <div class="board-page">
      <div class="board-wrap">
        <div class="fr-hero">
          <div class="fr-frame"><img id="fr-poster" src="art/frontrun/frontrun-03.jpg" alt="FRONTRUN — Crimson Standard"><iframe id="fr-live" title="FRONTRUN live render" scrolling="no" hidden></iframe><button class="board-btn fr-play" id="fr-play" hidden>&#9654; Live render</button></div>
          <div>
            <span class="chain-badge" data-chain="ethereum">ETH &middot; 2026 &middot; fully on-chain</span>
            <h1 class="fr-title">FRONTRUN</h1>
            <p class="fr-note" id="fr-note"></p>
            <p class="fr-desc" id="fr-desc"></p>
            <div class="fr-stats">
              <div><b>666</b><small>Supply</small></div>
              <div><b id="fr-held">&ndash;</b><small>In wallets</small></div>
              <div><b id="fr-holders">&ndash;</b><small>Holders</small></div>
            </div>
            <div class="fr-links">
              <a class="board-btn is-primary" href="https://frontrun.strangersolemn.art/race.html" target="_blank" rel="noopener">Enter the race</a>
              <a class="board-btn" href="https://frontrun.strangersolemn.art/board.html" target="_blank" rel="noopener">Race leaderboard</a>
              <a class="board-btn" href="https://opensea.io/collection/frontrun" target="_blank" rel="noopener">OpenSea</a>
              <a class="board-btn" href="collections.html#c/frontrun">View pieces</a>
            </div>
          </div>
        </div>
        <h2 class="fr-section">Holders</h2>
        <div id="board" data-collection="frontrun" data-limit="25" data-cotd="0"></div>
        <footer class="articles-footer"><p class="copyright">&copy; Stranger Solemn 2026</p></footer>
      </div>
    </div>
    <script>
      fetch('collections/frontrun.json').then(function (r) { return r.json(); }).then(function (d) {
        document.getElementById('fr-desc').textContent = d.description || '';
        document.getElementById('fr-note').textContent = d.artistNote || '';
        var live = (d.pieces || []).filter(function (p) { return p.animationUrl; })[0];
        if (live) {
          var btn = document.getElementById('fr-play'); btn.hidden = false;
          btn.onclick = function () {
            var f = document.getElementById('fr-live'); f.src = live.animationUrl; f.hidden = false;
            document.getElementById('fr-poster').hidden = true; btn.hidden = true;
          };
        }
      });
      document.addEventListener('collectors:ready', function (e) {
        var h = e.detail.collectors.filter(function (c) { return c.cols.frontrun; });
        document.getElementById('fr-holders').textContent = h.length;
        document.getElementById('fr-held').textContent = h.reduce(function (s, c) { return s + c.cols.frontrun; }, 0);
      });
    </script>
    <script src="collectors.js?v=1"></script>
  </body>
</html>
