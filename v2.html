<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        surface: "#131313",
        "surface-low": "#0e0e0e",
        "surface-mid": "#1c1b1b",
        "surface-high": "#2a2a2a",
        "surface-highest": "#353534",
        "on-surface": "#e5e2e1",
        muted: "#888888",
        dimmed: "#555555",
        "outline-v": "#474747",
        "chain-btc": "#f7931a",
        "chain-eth": "#627eea",
        "chain-tez": "#2c7df7",
        "chain-sol": "#9945ff",
      },
      fontFamily: { mono: ["Space Mono", "monospace"] },
      borderRadius: { DEFAULT: "0px" },

<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
.bg-grid { background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 48px 48px; position: relative; }
@media (max-width: 768px) {
  #meta-sidebar { display: none !important; }
  .flex.min-h-screen { flex-direction: column; }
  #artwork-frame, #home-view div[style*="aspect-ratio"] { height: calc(100vw - 40px) !important; max-height: calc(100vh - 140px) !important; }

.bg-grid::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 20%, #131313 75%); pointer-events: none; z-index: 0; }
.bg-grid > * { position: relative; z-index: 1; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #131313; }
::-webkit-scrollbar-thumb { background: #474747; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.animate-marquee { animation: marquee 40s linear infinite; }
.drawer-closed { transform: translateX(-100%); }
.drawer-open { transform: translateX(0); }
</style>

<body class="bg-surface text-on-surface font-mono">

<!-- DISPLAY MODE -->

    <!-- Display frame -->

      <button onclick="dispPrev()" class="px-3 py-1.5 border border-outline-v/40 text-muted text-[11px] uppercase hover:text-white hover:border-white/40"><span class="material-symbols-outlined text-sm">arrow_back</span></button>

            </div>
            <button onclick="enterDisplay(false)" class="px-3 py-1.5 border border-outline-v/40 text-muted text-[11px] uppercase hover:text-white hover:border-white/40">

            </button>
          </div>
        </div>
      </div>

      <!-- COLLECTION VIEW -->
      <div id="collection-view" class="max-w-5xl mx-auto space-y-8 hidden">

        <!-- ARTWORK DISPLAY -->
        <div class="flex flex-col items-center">
          <div class="w-fit">
            <!-- STATUS BAR -->
            <div class="bg-surface-high h-8 flex items-center justify-between px-4 text-[10px] text-muted uppercase tracking-widest border border-outline-v/15 mb-2">
              <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 bg-green-500"></span>
                <span id="status-piece">LOADING</span>
              </div>
              <div class="flex gap-4 ml-8">
                <span id="status-time">UTC: --:--:--</span>
                <span id="status-index">001 / 001</span>
              </div>
            </div>
            <!-- FRAME -->
            <div class="bg-surface-low border border-outline-v/20 p-3">
              <div class="relative overflow-hidden bg-black border border-[#1a1a1a]" id="artwork-frame" style="aspect-ratio:1/1; height:calc(100vh - 170px); max-height:calc(100vh - 170px);">
                <img id="v2-art-img" class="w-full h-full object-contain hidden" src="" alt="" />
                <iframe id="v2-art-iframe" class="w-full h-full border-none hidden" src="" title="Artwork"></iframe>

<script>
const chainNames = { ordinals: 'BTC', ethereum: 'ETH', tezos: 'TEZ', solana: 'SOL' };
const chainColors = { ordinals: '#f7931a', ethereum: '#627eea', tezos: '#2c7df7', solana: '#9945ff' };
let manifest = [];
let collectionCache = {};
let currentCollection = null;
let currentIndex = 0;
let activeFilter = null;

// Clock
setInterval(() => {
  const d = new Date();
  document.getElementById('status-time').textContent = 'UTC: ' + d.toISOString().slice(11, 19);
}, 1000);

async function loadManifest() {
  const r = await fetch('collections/manifest.json');
  manifest = await r.json();
  buildDrawer();
}

async function loadCol(id) {
  if (collectionCache[id]) return collectionCache[id];
  const r = await fetch(`collections/${id}.json`);
  const d = await r.json();
  const m = manifest.find(c => c.id === id);
  if (m) {
    if (m.galleryUrl) d.galleryUrl = m.galleryUrl;
    if (m.marketplaces) d.marketplaces = { ...(d.marketplaces || {}), ...m.marketplaces };
  }
  collectionCache[id] = d;
  return d;
}

function buildDrawer() {
  const el = document.getElementById('drawer-timeline');
  const years = {};
  manifest.forEach(c => { (years[c.year] = years[c.year] || []).push(c); });
  let html = '';
  Object.keys(years).sort((a, b) => b - a).forEach(yr => {
    html += `<div class="mb-4"><div class="text-xs font-bold text-white mb-2 uppercase tracking-wider">${yr}</div>`;
    years[yr].forEach(c => {
      const color = chainColors[c.chain] || '#888';
      const cn = chainNames[c.chain] || c.chain;
      html += `<button data-chain="${c.chain}" onclick="showCollection('${c.id}');closeDrawer()" class="timeline-entry w-full flex items-center gap-2 px-2 py-1.5 text-left hover:bg-surface-high group">
        <span class="text-[9px] px-1.5 py-0.5 border font-bold uppercase" style="color:${color};border-color:${color}40">${cn}</span>
        <span class="text-xs text-muted group-hover:text-white flex-1 truncate">${c.title}</span>
        ${c.uniquePieces ? `<span class="text-[10px] text-dimmed">${c.uniquePieces}</span>` : ''}
      </button>`;
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

function buildTicker() {
  const parts = manifest.map(c => `${c.title.toUpperCase()}: ${c.uniquePieces || '?'} PCS`);
  const txt = parts.join(' | ') + ' | NETWORK: STABLE | STATUS: LIVE';
  document.getElementById('ticker-1').textContent = txt;
  document.getElementById('ticker-2').textContent = txt;
}

async function showCollection(id) {
  const col = await loadCol(id);
  currentCollection = col;
  currentIndex = 0;
  const m = manifest.find(c => c.id === id) || {};

  // Meta sidebar
  const badge = document.getElementById('meta-chain-badge');
  const chain = col.chain || m.chain || 'ordinals';
  const color = chainColors[chain] || '#888';
  badge.textContent = (chainNames[chain] || chain) + '_NETWORK';
  badge.style.backgroundColor = color;
  badge.style.color = '#000';

  document.getElementById('meta-title').textContent = col.title || m.title;
  document.getElementById('meta-note').textContent = col.artistNote || col.description || '';
  document.getElementById('meta-count').textContent = (col.pieces?.length || m.uniquePieces || 0).toLocaleString();
  document.getElementById('meta-year').textContent = col.year || m.year || '—';
  document.getElementById('meta-status').textContent = col.onchain || m.onchain ? 'ON-CHAIN' : 'OFF-CHAIN';
  void 0 // top-view-label removed = (col.title || '').toUpperCase();

  // Marketplace links
  const linksEl = document.getElementById('meta-links');
  let linksHtml = '';
  if (col.galleryUrl) linksHtml += mkLink('GALLERY', col.galleryUrl);
  const mps = col.marketplaces || {};
  if (mps.superrare) linksHtml += mkLink('SUPERRARE', mps.superrare);
  if (mps.opensea) linksHtml += mkLink('OPENSEA', mps.opensea);
  if (mps.ordinals) linksHtml += mkLink('ORDINALS', mps.ordinals);
  if (mps.objkt) linksHtml += mkLink('OBJKT', mps.objkt);
  linksEl.innerHTML = linksHtml;

  // Piece grid
  buildGrid(col);
  showPiece(0);
}

function mkLink(label, url) {
  return `<a href="${url}" target="_blank" rel="noopener" class="text-[11px] text-muted hover:text-white flex justify-between items-center">
    ${label} <span class="material-symbols-outlined text-[14px]">open_in_new</span></a>`;
}

function buildGrid(col) {
  const el = document.getElementById('piece-grid');
  if (!col.pieces?.length) { el.innerHTML = '<p class="text-muted text-xs col-span-full">No pieces loaded</p>'; return; }
  el.innerHTML = col.pieces.map((p, i) => {
    const thumb = p.thumbnail || p.image || '';
    const isCode = !p.image || (p.animationUrl && (p.animationUrl.startsWith('<') || p.animationUrl.startsWith('data:')));
    return `<button onclick="showPiece(${i})" class="aspect-square bg-surface-high border border-outline-v/10 overflow-hidden relative group hover:border-white/30">
      ${thumb ? `<img src="${thumb}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100" loading="lazy" alt="${p.title || ''}" />` : '<div class="w-full h-full flex items-center justify-center text-dimmed text-[10px]">CODE</div>'}
      <div class="absolute bottom-0 left-0 right-0 bg-black/70 px-1 py-0.5 text-[8px] text-muted truncate opacity-0 group-hover:opacity-100">${p.title || ''}</div>
    </button>`;
  }).join('');
}

function showPiece(idx) {
  if (!currentCollection?.pieces?.length) return;
  currentIndex = idx;
  const piece = currentCollection.pieces[idx];
  const img = document.getElementById('v2-art-img');
  const iframe = document.getElementById('v2-art-iframe');
  const video = document.getElementById('v2-art-video');
  img.classList.add('hidden'); iframe.classList.add('hidden'); video.classList.add('hidden');
  iframe.src = '';

  if (needsVideo(piece)) {
    video.src = piece.animationUrl;
    video.classList.remove('hidden');
    video.play().catch(() => {});
  } else if (needsIframe(piece)) {
    iframe.src = getIframeSrc(piece);
    iframe.classList.remove('hidden');
  } else {
    img.src = piece.image || piece.thumbnail || '';
    img.classList.remove('hidden');
  }

  document.getElementById('status-piece').textContent = (piece.title || 'UNTITLED').toUpperCase();
  document.getElementById('status-index').textContent = String(idx + 1).padStart(3, '0') + ' / ' + String(currentCollection.pieces.length).padStart(3, '0');
  document.getElementById('action-piece-title').textContent = piece.title || '';
}

function needsVideo(p) {
  if (!p.animationUrl) return false;
  const u = p.animationUrl.toLowerCase();
  return u.endsWith('.mp4') || u.endsWith('.webm') || u.endsWith('.mov');
}

function needsIframe(p) {
  if (!p.animationUrl) return false;
  const a = p.animationUrl;
  return a.startsWith('<') || a.startsWith('data:') || (currentCollection?.onchain && a.includes('ordinals.com/content/'));
}

function getIframeSrc(p) {
  if (p.animationUrl.startsWith('<')) return URL.createObjectURL(new Blob([p.animationUrl], { type: 'text/html' }));
  return p.animationUrl;
}

function prevPiece() { if (!currentCollection?.pieces) return; showPiece((currentIndex - 1 + currentCollection.pieces.length) % currentCollection.pieces.length); }
function nextPiece() { if (!currentCollection?.pieces) return; showPiece((currentIndex + 1) % currentCollection.pieces.length); }
function shufflePiece() { if (!currentCollection?.pieces) return; showPiece(Math.floor(Math.random() * currentCollection.pieces.length)); }

let displayLocked = null; // locked to collection, or null for global
let homeSlideshowTimer = null;
let currentView = 'home'; // 'home' or 'collection'

function openDrawer() { document.getElementById('drawer').classList.remove('drawer-closed'); document.getElementById('drawer').classList.add('drawer-open'); document.getElementById('drawer-overlay').classList.remove('hidden'); }
function closeDrawer() { document.getElementById('drawer').classList.add('drawer-closed'); document.getElementById('drawer').classList.remove('drawer-open'); document.getElementById('drawer-overlay').classList.add('hidden'); }

function filterChain(chain) {
  activeFilter = chain;
  document.querySelectorAll('.timeline-entry').forEach(el => {
    el.style.display = (!chain || el.dataset.chain === chain) ? '' : 'none';
  });
}

// VIEW SWITCHING
function goHome() {
  currentView = 'home';
  document.getElementById('home-view').classList.remove('hidden');
  document.getElementById('collection-view').classList.add('hidden');
  document.getElementById('meta-sidebar').classList.add('hidden');
  document.getElementById('meta-sidebar').classList.remove('md:flex');
  void 0 // top-view-label removed = 'HOME';
  startHomeSlideshow();
}

function goCollection() {
  currentView = 'collection';
  stopHomeSlideshow();
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('collection-view').classList.remove('hidden');
  document.getElementById('meta-sidebar').classList.remove('hidden');
  document.getElementById('meta-sidebar').classList.add('md:flex');
}

// HOME SLIDESHOW
const slideshowWeights = [
  { id: 'everyday-strange', w: 30 }, { id: 'stranger-days', w: 30 },
  { id: 'the-masters', w: 15 }, { id: 'reflections', w: 10 },
  { id: 'the-ord-lot', w: 10 }, { id: 'renascent', w: 10 },
  { id: 'safari', w: 8 }, { id: 'one-of-one-originals', w: 8 },
  { id: 'editions-by-solemn', w: 5 }, { id: 'fiat-mafia', w: 5 },
  { id: 'deliverance', w: 5 }, { id: 'leverage', w: 4 },
];
let lastHomeColId = null;

function weightedRandom(exclude) {
  const pool = slideshowWeights.filter(w => w.id !== exclude && manifest.find(m => m.id === w.id));
  const total = pool.reduce((s, w) => s + w.w, 0);
  let r = Math.random() * total;
  for (const w of pool) { r -= w.w; if (r <= 0) return w.id; }
  return pool[pool.length - 1]?.id || manifest[0]?.id;
}

async function homeRandomArt() {
  const id = weightedRandom(lastHomeColId);
  lastHomeColId = id;
  const col = await loadCol(id);
  if (!col.pieces?.length) return;
  const piece = col.pieces[Math.floor(Math.random() * col.pieces.length)];

  const img = document.getElementById('home-art-img');
  const iframe = document.getElementById('home-art-iframe');
  const video = document.getElementById('home-art-video');
  img.classList.add('hidden'); iframe.classList.add('hidden'); video.classList.add('hidden');
  iframe.src = '';

  // Temp set current for display mode
  currentCollection = col;
  currentIndex = col.pieces.indexOf(piece);

  if (needsVideo(piece)) {
    video.src = piece.animationUrl; video.classList.remove('hidden'); video.play().catch(()=>{});
  } else if (needsIframe(piece)) {
    iframe.src = getIframeSrc(piece); iframe.classList.remove('hidden');
  } else {
    img.src = piece.image || piece.thumbnail || ''; img.classList.remove('hidden');
  }
  document.getElementById('home-art-title').textContent = piece.title || '';
  document.getElementById('home-art-collection').textContent = col.title || '';
}

function startHomeSlideshow() {
  homeRandomArt();
  homeSlideshowTimer = setInterval(homeRandomArt, 20000);
}
function stopHomeSlideshow() {
  if (homeSlideshowTimer) { clearInterval(homeSlideshowTimer); homeSlideshowTimer = null; }
}

// DISPLAY MODE
function enterDisplay(locked) {
  displayLocked = locked ? currentCollection : null;
  const dm = document.getElementById('display-mode');
  dm.classList.remove('hidden');
  stopHomeSlideshow();
  loadDisplayPiece();
}

function exitDisplay() {
  const dm = document.getElementById('display-mode');
  dm.classList.add('hidden');
  const iframe = document.getElementById('disp-iframe');
  if (iframe) iframe.src = '';
  displayLocked = null;
  if (currentView === 'home') startHomeSlideshow();
}

function loadDisplayPiece() {
  if (!currentCollection?.pieces?.length) return;
  const piece = currentCollection.pieces[currentIndex];
  const img = document.getElementById('disp-img');
  const iframe = document.getElementById('disp-iframe');
  const video = document.getElementById('disp-video');
  img.classList.add('hidden'); iframe.classList.add('hidden'); video.classList.add('hidden');
  iframe.src = '';

  if (needsVideo(piece)) {
    video.src = piece.animationUrl; video.classList.remove('hidden'); video.play().catch(()=>{});
  } else if (needsIframe(piece)) {
    iframe.src = getIframeSrc(piece); iframe.classList.remove('hidden');
  } else {
    img.src = piece.image || piece.thumbnail || ''; img.classList.remove('hidden');
  }
  document.getElementById('disp-piece-title').textContent = (piece.title || 'UNTITLED').toUpperCase();
  document.getElementById('disp-collection-name').textContent = (currentCollection.title || '').toUpperCase();
}

function dispPrev() {
  if (displayLocked) {
    currentCollection = displayLocked;
    currentIndex = (currentIndex - 1 + currentCollection.pieces.length) % currentCollection.pieces.length;
    loadDisplayPiece();
  } else { dispGlobalRandom(); }
}
function dispNext() {
  if (displayLocked) {
    currentCollection = displayLocked;
    currentIndex = (currentIndex + 1) % currentCollection.pieces.length;
    loadDisplayPiece();
  } else { dispGlobalRandom(); }
}
function dispShuffle() {
  if (displayLocked) {
    currentCollection = displayLocked;
    currentIndex = Math.floor(Math.random() * currentCollection.pieces.length);
    loadDisplayPiece();
  } else { dispGlobalRandom(); }
}
async function dispGlobalRandom() {
  const id = weightedRandom(lastHomeColId);
  lastHomeColId = id;
  const col = await loadCol(id);
  if (!col.pieces?.length) return;
  currentCollection = col;
  currentIndex = Math.floor(Math.random() * col.pieces.length);
  loadDisplayPiece();
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('display-mode').classList.contains('hidden')) {
    if (e.key === 'Escape') exitDisplay();
    if (e.key === 'ArrowLeft') dispPrev();
    if (e.key === 'ArrowRight') dispNext();
    if (e.key === ' ') { e.preventDefault(); dispShuffle(); }
  }
});

// Show display controls on mouse move
document.getElementById('display-mode').addEventListener('mousemove', () => {
  const c = document.getElementById('disp-controls');
  c.style.opacity = '1';
  clearTimeout(c._hideTimer);
  c._hideTimer = setTimeout(() => c.style.opacity = '0', 3000);
});

// Wrap showCollection to switch view
const _origShowCol = showCollection;
showCollection = async function(id) {
  goCollection();
  await _origShowCol(id);
};

// Init
(async () => {
  await loadManifest();
  goHome();
})();
</script>
</body>
